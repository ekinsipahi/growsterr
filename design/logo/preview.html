<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:600 14px system-ui;width:1600px}
.row{display:flex}.cell{flex:1;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.light{background:#FAF9FF;color:#17142E}.dark{background:#0F0D1F;color:#F4F2FF}
.wm img{width:560px;height:auto}.ic img{width:180px;height:180px}
</style></head><body>
<div class="row wm"><div class="cell light">logo.svg<img src="logo.svg"></div><div class="cell dark">logo-dark.svg<img src="logo-dark.svg"></div></div>
<div class="row ic"><div class="cell light">icon.svg<img src="icon.svg"></div><div class="cell dark">icon.svg<img src="icon.svg"></div><div class="cell light">mark.svg<img src="mark.svg"></div><div class="cell dark">mark-dark.svg<img src="mark-dark.svg"></div><div class="cell dark">icon-inverse.svg<img src="icon-inverse.svg"></div></div>
</body></html>
