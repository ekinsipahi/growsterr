{# Breadcrumbs (the BreadcrumbList JSON-LD is built from the same list). Context: crumbs = [(label, path)]. #}
<nav class="pg-crumbs" aria-label="{{ pu.crumbs_label }}">
  <ol>
    {% for label, url in crumbs %}
    <li>{% if forloop.last %}<span aria-current="page">{{ label }}</span>{% else %}<a href="{{ url }}">{{ label }}</a>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
